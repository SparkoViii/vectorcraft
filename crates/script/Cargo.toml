[package]
name = "vectorcraft-script"
description = "JavaScript scripts for VectorCraft: an embedded Boa engine driving the command registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
vectorcraft-engine = { workspace = true }
serde_json = { workspace = true }
boa_engine = { workspace = true }

# The browser's clock and random numbers (Date.now, Math.random) on the web.
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
vectorcraft-testkit = { workspace = true }
proptest = { workspace = true }
